name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: huggingface_space/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.110.0" "pydantic>=2.6.0" httpx

      - name: Run corpus validation suite
        run: |
          python tools/validation/run_all.py
          python tools/validation/test_corpus_validation.py
          python tools/validation/verify_text_integrity.py --baseline origin/main
          python tools/content_import/validate_json.py

      - name: Run backend tests
        working-directory: huggingface_space
        env:
          SITARAM_APP_KEY: ci_test_key
        run: python -m unittest test_backend

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
